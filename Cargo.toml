[package]
name = "chatbucket-manager"
version = "0.2.0"
edition = "2021"
authors = ["ChatBucket"]
description = "Native Rust GUI Manager for ChatBucket (migrated from pywebview)"
license = "MIT"

[[bin]]
name = "chatbucket-manager"
path = "src/main.rs"

[dependencies]
# GUI: pure Rust, cross-platform, no WebView2 / webkit2gtk needed
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.27"

# System info / process discovery (replaces psutil)
sysinfo = "0.30"

# JSON (host-state.json, tailscale --json, GitHub API, syncthing REST)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP (health check, syncthing REST, GitHub releases)
ureq = { version = "2.9", features = ["json", "tls"] }

# Time / timestamps
chrono = { version = "0.4", features = ["serde"] }

# Logging (replaces bare print() in Python code)
log = "0.4"
env_logger = "0.11"

# Random jitter (for arbitration)
rand = "0.8"

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Tray icon (replaces pystray) — optional so a headless build (CI, docker,
# no GTK/gdk-pixbuf on the box) still compiles cleanly.
tray-icon = { version = "0.13", optional = true }

# ZIP extraction for updates (replaces zipfile)
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# hostname detection
hostname = "0.4"

# tempfile
tempfile = "3"

# platform-specific for graceful shutdown signals
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "wincon", "winbase", "handleapi"] }

[features]
default = ["tray"]
tray = ["dep:tray-icon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
