<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatBucket Manager</title>
<style>
/* ── design tokens — lifted directly from ChatBucket's own index.css ──────
   Same true-black surface stack, same font stack, same status-dot
   convention (--success/online, gray/offline) already used throughout
   the chat UI. The Manager should read as part of this project, not a
   bolted-on generic tool — see ChatBucket_Manager_Architecture.md §15. */
:root {
    --bg:          #000000;
    --surface-1:   #000000;
    --surface-2:   #121212;
    --surface-3:   #1a1a1a;
    --surface-4:   #242424;
    --border-1:    #1f1f1f;
    --border-2:    #2a2a2a;
    --border-3:    #3a3a3a;
    --text:        #f5f5f5;
    --text-2:      #b5b5b5;
    --text-3:      #7a7a7a;
    --text-4:      #545454;
    --success:     #4ade80;
    --danger:      #ff6b6b;
    --warn:        #fbbf24;
    --radius-sm:   10px;
    --radius-md:   14px;
    --radius-pill: 999px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
            Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: 20px;
    user-select: none;
}

h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
}

#subtitle {
    color: var(--text-3);
    font-size: 12px;
    margin-bottom: 20px;
}

.card {
    background: var(--surface-2);
    border: 1px solid var(--border-1);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 14px;
}

.card-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 8px;
}

.role-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}

.role-badge.host   { color: var(--success); }
.role-badge.client { color: var(--text); }
.role-badge.idle   { color: var(--text-3); }

.role-detail {
    color: var(--text-2);
    font-size: 12px;
    margin-top: 4px;
}

.status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}
.status-dot.online  { background: var(--success); box-shadow: 0 0 6px rgba(74,222,128,0.5); }
.status-dot.offline { background: #555; }
.status-dot.error   { background: var(--danger); }
.status-dot.self    { background: var(--text-3); }

.peer-name { flex: 1; color: var(--text); }
.peer-state { color: var(--text-3); font-size: 11.5px; }

#hidden-note {
    color: var(--text-4);
    font-size: 11px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-1);
}

#error-banner {
    display: none;
    background: #1a0e0e;
    color: var(--danger);
    border: 1px solid #3a1616;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 12px;
    margin-bottom: 14px;
}

#refresh-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface-4);
    color: var(--text);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
}
#refresh-btn:hover  { background: #2e2e2e; border-color: var(--border-3); }
#refresh-btn:active { transform: translateY(1px); }

#last-updated {
    text-align: center;
    color: var(--text-4);
    font-size: 10.5px;
    margin-top: 8px;
    letter-spacing: 0.02em;
}
</style>
</head>
<body>

<h1>ChatBucket Manager</h1>
<div id="subtitle">this machine: <span id="my-name">—</span></div>

<div id="error-banner"></div>

<div class="card">
    <div class="card-label">Role</div>
    <div class="role-badge idle" id="role-badge">—</div>
    <div class="role-detail" id="role-detail"></div>
</div>

<div class="card">
    <div class="card-label">Claimed host reachability</div>
    <div id="claimed-status"></div>
</div>

<div class="card">
    <div class="card-label">Tailnet peers</div>
    <div id="peer-list"></div>
    <div id="hidden-note" style="display:none;"></div>
</div>

<button id="refresh-btn">Refresh</button>
<div id="last-updated"></div>

<script>
function statusRow(dotClass, name, state) {
    const row = document.createElement("div");
    row.className = "status-row";
    const dot = document.createElement("span");
    dot.className = "status-dot " + dotClass;
    const nameEl = document.createElement("span");
    nameEl.className = "peer-name";
    nameEl.textContent = name;
    const stateEl = document.createElement("span");
    stateEl.className = "peer-state";
    stateEl.textContent = state;
    row.appendChild(dot);
    row.appendChild(nameEl);
    row.appendChild(stateEl);
    return row;
}

function render(data) {
    document.getElementById("my-name").textContent = data.my_name;

    const errorBanner = document.getElementById("error-banner");
    const hs = data.host_state;
    const roleBadge = document.getElementById("role-badge");
    const roleDetail = document.getElementById("role-detail");

    if (!hs.ok) {
        errorBanner.style.display = "block";
        errorBanner.textContent = "host-state.json is corrupted: " + hs.error;
        roleBadge.className = "role-badge idle";
        roleBadge.textContent = "UNKNOWN";
        roleDetail.textContent = "";
    } else {
        errorBanner.style.display = "none";
        const claimed = data.claimed_machine;
        if (claimed === null) {
            roleBadge.className = "role-badge idle";
            roleBadge.textContent = "IDLE";
            roleDetail.textContent = "No claim on record — nobody has ever hosted.";
        } else if (claimed === data.my_name) {
            roleBadge.className = "role-badge host";
            roleBadge.textContent = "HOST";
            roleDetail.textContent = "This machine is currently serving ChatBucket.";
        } else {
            roleBadge.className = "role-badge client";
            roleBadge.textContent = "CLIENT";
            roleDetail.textContent = "Host is currently: " + claimed;
        }
    }

    const claimedStatusEl = document.getElementById("claimed-status");
    claimedStatusEl.innerHTML = "";
    if (data.claimed_machine === null) {
        claimedStatusEl.appendChild(statusRow("offline", "—", "no claim to check"));
    } else {
        const cs = data.claimed_status;
        if (cs.self) {
            claimedStatusEl.appendChild(statusRow("self", data.claimed_machine, "this machine"));
        } else if (cs.error) {
            claimedStatusEl.appendChild(statusRow("error", data.claimed_machine, "error"));
        } else {
            claimedStatusEl.appendChild(
                statusRow(cs.online ? "online" : "offline", data.claimed_machine,
                          cs.online ? "online" : "offline")
            );
        }
    }

    const peerListEl = document.getElementById("peer-list");
    const hiddenNoteEl = document.getElementById("hidden-note");
    peerListEl.innerHTML = "";
    const tp = data.tailnet_peers;
    if (!tp.ok) {
        peerListEl.appendChild(statusRow("error", "—", "error: " + tp.error));
        hiddenNoteEl.style.display = "none";
    } else if (tp.peers.length === 0) {
        peerListEl.appendChild(statusRow("offline", "—", "no peers found"));
        hiddenNoteEl.style.display = "none";
    } else {
        const sorted = tp.peers.slice().sort((a, b) => a.name.localeCompare(b.name));
        sorted.forEach(p => {
            peerListEl.appendChild(statusRow(p.online ? "online" : "offline", p.name,
                                              p.online ? "online" : "offline"));
        });
        if (tp.hidden_count > 0) {
            hiddenNoteEl.style.display = "block";
            hiddenNoteEl.textContent =
                "+" + tp.hidden_count + " infrastructure peer(s) hidden (no DNSName, likely Tailscale Funnel)";
        } else {
            hiddenNoteEl.style.display = "none";
        }
    }

    document.getElementById("last-updated").textContent =
        "updated " + new Date().toLocaleTimeString();
}

function refresh() {
    window.pywebview.api.get_status().then(render).catch(err => {
        const errorBanner = document.getElementById("error-banner");
        errorBanner.style.display = "block";
        errorBanner.textContent = "Failed to fetch status: " + err;
    });
}

document.getElementById("refresh-btn").addEventListener("click", refresh);

// pywebview's api bridge isn't available until this event fires — calling
// window.pywebview.api before it does is a guaranteed silent failure.
window.addEventListener("pywebviewready", function() {
    refresh();
    // Lightweight auto-refresh. Each call costs 1-2 `tailscale status`
    // subprocess invocations — negligible on this hardware at a 15s
    // interval, not worth optimizing away for a tool that's glanced at
    // occasionally, not polled in a hot loop.
    setInterval(refresh, 15000);
});
</script>

</body>
</html>
