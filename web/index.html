<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatBucket Manager</title>
<style>
:root {
    --bg:          #000000;
    --surface-1:   #000000;
    --surface-2:   #121212;
    --surface-3:   #1a1a1a;
    --surface-4:   #242424;
    --border-1:    #1f1f1f;
    --border-2:    #2a2a2a;
    --border-3:    #3a3a3a;
    --text:        #f5f5f5;
    --text-2:      #b5b5b5;
    --text-3:      #7a7a7a;
    --text-4:      #545454;
    --success:     #4ade80;
    --danger:      #ff6b6b;
    --warn:        #fbbf24;
    --radius-sm:   10px;
    --radius-md:   14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
            Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: 20px;
    user-select: none;
}

h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; }
#subtitle { color: var(--text-3); font-size: 12px; margin-bottom: 20px; }

.card {
    background: var(--surface-2);
    border: 1px solid var(--border-1);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 14px;
}

.card-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 8px;
}

.role-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
.role-badge.host      { color: var(--success); }
.role-badge.client    { color: var(--text); }
.role-badge.idle      { color: var(--text-3); }
.role-badge.stale     { color: var(--warn); }
.role-badge.conflict  { color: var(--danger); }
.role-badge.unknown   { color: var(--danger); }
.role-badge.starting {
    color: var(--text-2);
    animation: role-starting-pulse 1.4s ease-in-out infinite;
}
@keyframes role-starting-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) {
    .role-badge.starting { animation: none; }
}
.role-detail { color: var(--text-2); font-size: 12px; margin-top: 4px; }

.status-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.status-dot.online  { background: var(--success); box-shadow: 0 0 6px rgba(74,222,128,0.5); }
.status-dot.offline { background: #555; }
.status-dot.error   { background: var(--danger); }
.status-dot.self    { background: var(--text-3); }
.status-dot.warn    { background: var(--warn); }

.peer-name { flex: 1; color: var(--text); }
.peer-state { color: var(--text-3); font-size: 11.5px; }

#hidden-note { color: var(--text-4); font-size: 11px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-1); }

#error-banner, #warn-banner, #info-banner {
    display: none;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 12px;
    margin-bottom: 14px;
}
#error-banner { background: #1a0e0e; color: var(--danger); border: 1px solid #3a1616; }
#warn-banner  { background: #241c06; color: var(--warn);   border: 1px solid #4a3a0f; }
#info-banner  { background: #0e1a14; color: var(--success); border: 1px solid #163a24; }

.process-controls { display: flex; gap: 8px; margin-top: 10px; }
.btn {
    flex: 1;
    padding: 9px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-2);
    background: var(--surface-4);
    color: var(--text);
    transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
}
.btn:hover:not(:disabled)  { background: #2e2e2e; border-color: var(--border-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.danger { border-color: #4a2020; }
.btn.danger:hover:not(:disabled) { background: #2a1414; }

.btn-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22);
    border-top-color: var(--text);
    animation: btn-spin 0.7s linear infinite;
    margin-right: 7px;
    vertical-align: -2px;
}
@keyframes btn-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
    .btn-spinner { animation: none; opacity: 0.6; }
}

#refresh-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface-4);
    color: var(--text);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
}
#refresh-btn:hover:not(:disabled)  { background: #2e2e2e; border-color: var(--border-3); }
#refresh-btn:active:not(:disabled) { transform: translateY(1px); }
#refresh-btn:disabled { opacity: 0.5; cursor: default; }

#last-updated { text-align: center; color: var(--text-4); font-size: 10.5px; margin-top: 8px; letter-spacing: 0.02em; }

/* ── Update card (§14) ────────────────────────────────────────
   Kept structurally identical to every other card so it visually
   fits the existing token language (see Architecture doc §15).
   Version numbers use a monospace stack so digits column-align
   at a glance ("0.9.3" vs "0.10.0" would otherwise look wrong). */
.version-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 3px 0;
    font-size: 12.5px;
    color: var(--text-2);
}
.version-row .v-label { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.version-row .v-value { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--text); }
.update-note {
    color: var(--text-2);
    font-size: 12px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-1);
}
.update-controls { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

<h1>ChatBucket Manager</h1>
<div id="subtitle">this machine: <span id="my-name">—</span></div>

<div id="error-banner"></div>
<div id="warn-banner"></div>
<div id="info-banner"></div>

<div class="card">
    <div class="card-label">Role</div>
    <div class="role-badge idle" id="role-badge">—</div>
    <div class="role-detail" id="role-detail"></div>
</div>

<div class="card">
    <div class="card-label">Process</div>
    <div id="process-status"></div>
    <div class="process-controls">
        <button class="btn" id="start-btn">Start</button>
        <button class="btn danger" id="stop-btn">Stop</button>
    </div>
</div>

<div class="card">
    <div class="card-label">Claimed host reachability</div>
    <div id="claimed-status"></div>
</div>

<div class="card">
    <div class="card-label">Tailnet peers</div>
    <div id="peer-list"></div>
    <div id="hidden-note" style="display:none;"></div>
</div>

<div class="card">
    <div class="card-label">Syncthing (sync-state)</div>
    <div id="syncthing-status"></div>
</div>

<div class="card">
    <div class="card-label">Version</div>
    <div class="version-row"><span class="v-label">installed</span><span class="v-value" id="v-installed">—</span></div>
    <div class="version-row"><span class="v-label">latest</span><span class="v-value" id="v-latest">not checked</span></div>
    <div class="update-note" id="update-detail" style="display:none;"></div>
    <div class="update-controls">
        <button class="btn" id="check-update-btn">Check for Updates</button>
        <button class="btn" id="install-update-btn" style="display:none;">Install Update</button>
    </div>
</div>

<button id="refresh-btn">Refresh</button>
<div id="last-updated"></div>

<script>
const STARTING_FAST_REFRESH_MS = 1500;
const NORMAL_REFRESH_MS = 15000;
const STARTING_MAX_VISIBLE_MS = 45000;

let startingSince = null;
let fastRefreshHandle = null;
let normalRefreshHandle = null;
let lastUpdateCheck = null;   // remembered latest tag for the Install click.

function statusRow(dotClass, name, state) {
    const row = document.createElement("div");
    row.className = "status-row";
    const dot = document.createElement("span");
    dot.className = "status-dot " + dotClass;
    const nameEl = document.createElement("span");
    nameEl.className = "peer-name";
    nameEl.textContent = name;
    const stateEl = document.createElement("span");
    stateEl.className = "peer-state";
    stateEl.textContent = state;
    row.appendChild(dot);
    row.appendChild(nameEl);
    row.appendChild(stateEl);
    return row;
}

function showBanner(id, msg) {
    const b = document.getElementById(id);
    b.style.display = "block";
    b.textContent = msg;
}
function hideBanner(id) {
    document.getElementById(id).style.display = "none";
}
function showWarn(msg) { showBanner("warn-banner", msg); }
function hideWarn()    { hideBanner("warn-banner"); }
function showInfo(msg) { showBanner("info-banner", msg); }
function hideInfo()    { hideBanner("info-banner"); }

function setBusyLabel(btn, busyText) {
    btn.dataset.originalLabel = btn.textContent;
    btn.innerHTML = '<span class="btn-spinner"></span>' + busyText;
}
function restoreLabel(btn) {
    if (btn.dataset.originalLabel !== undefined) {
        btn.textContent = btn.dataset.originalLabel;
        delete btn.dataset.originalLabel;
    }
}

function stopFastRefresh() {
    if (fastRefreshHandle !== null) {
        clearInterval(fastRefreshHandle);
        fastRefreshHandle = null;
    }
    startingSince = null;
}

function startFastRefresh() {
    if (fastRefreshHandle !== null) return;
    startingSince = Date.now();
    fastRefreshHandle = setInterval(() => {
        if (Date.now() - startingSince > STARTING_MAX_VISIBLE_MS) {
            stopFastRefresh();
            showWarn(
                "STARTING has been shown for a while — the arbitration process may " +
                "be wedged. Try Stop, then Start again."
            );
            return;
        }
        refresh();
    }, STARTING_FAST_REFRESH_MS);
}

function render(data) {
    document.getElementById("my-name").textContent = data.my_name;

    const errorBanner = document.getElementById("error-banner");
    const hs = data.host_state;
    if (!hs.ok) {
        errorBanner.style.display = "block";
        errorBanner.textContent = "host-state.json is corrupted: " + hs.error;
    } else {
        errorBanner.style.display = "none";
    }

    const rs = data.role_state;
    const roleBadge = document.getElementById("role-badge");
    const roleDetail = document.getElementById("role-detail");
    roleBadge.className = "role-badge " + rs.state;
    roleBadge.textContent = rs.label;
    roleDetail.textContent = rs.detail;

    if (rs.state === "starting") {
        startFastRefresh();
    } else {
        stopFastRefresh();
    }

    const procEl = document.getElementById("process-status");
    procEl.innerHTML = "";
    const proc = data.process;
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    if (proc.running) {
        procEl.appendChild(statusRow("online", "pid " + proc.pid, proc.role));
        startBtn.disabled = true;
        stopBtn.disabled = false;
    } else {
        procEl.appendChild(statusRow("offline", "—", "not running"));
        startBtn.disabled = false;
        stopBtn.disabled = true;
    }

    const claimedStatusEl = document.getElementById("claimed-status");
    claimedStatusEl.innerHTML = "";
    if (data.claimed_machine === null) {
        claimedStatusEl.appendChild(statusRow("offline", "—", "no claim to check"));
    } else {
        const cs = data.claimed_status;
        if (cs.self) {
            claimedStatusEl.appendChild(statusRow("self", data.claimed_machine, "this machine"));
        } else if (cs.error) {
            claimedStatusEl.appendChild(statusRow("error", data.claimed_machine, "error"));
        } else {
            claimedStatusEl.appendChild(
                statusRow(cs.online ? "online" : "offline", data.claimed_machine,
                          cs.online ? "online" : "offline")
            );
        }
    }

    const peerListEl = document.getElementById("peer-list");
    const hiddenNoteEl = document.getElementById("hidden-note");
    peerListEl.innerHTML = "";
    const tp = data.tailnet_peers;
    if (!tp.ok) {
        peerListEl.appendChild(statusRow("error", "—", "error: " + tp.error));
        hiddenNoteEl.style.display = "none";
    } else if (tp.peers.length === 0) {
        peerListEl.appendChild(statusRow("offline", "—", "no peers found"));
        hiddenNoteEl.style.display = "none";
    } else {
        const sorted = tp.peers.slice().sort((a, b) => a.name.localeCompare(b.name));
        sorted.forEach(p => {
            peerListEl.appendChild(statusRow(p.online ? "online" : "offline", p.name,
                                              p.online ? "online" : "offline"));
        });
        if (tp.hidden_count > 0) {
            hiddenNoteEl.style.display = "block";
            hiddenNoteEl.textContent =
                "+" + tp.hidden_count + " infrastructure peer(s) hidden (no DNSName, likely Tailscale Funnel)";
        } else {
            hiddenNoteEl.style.display = "none";
        }
    }

    const syncthingEl = document.getElementById("syncthing-status");
    syncthingEl.innerHTML = "";
    const st = data.syncthing;
    if (st.state === "not_configured") {
        syncthingEl.appendChild(statusRow("offline", "sync-state", "not configured"));
    } else if (st.state === "in_sync") {
        syncthingEl.appendChild(statusRow("online", "sync-state", "in sync"));
    } else if (st.state === "syncing") {
        syncthingEl.appendChild(statusRow("warn", "sync-state", "syncing…"));
    } else {
        syncthingEl.appendChild(statusRow("error", "sync-state", st.detail || "error"));
    }

    document.getElementById("v-installed").textContent = data.version || "(missing)";

    document.getElementById("last-updated").textContent =
        "updated " + new Date().toLocaleTimeString();
}

function refresh() {
    window.pywebview.api.get_status().then(render).catch(err => {
        const errorBanner = document.getElementById("error-banner");
        errorBanner.style.display = "block";
        errorBanner.textContent = "Failed to fetch status: " + err;
    });
}

function setButtonsBusy(busy) {
    document.getElementById("start-btn").disabled = busy;
    document.getElementById("stop-btn").disabled = busy;
    document.getElementById("refresh-btn").disabled = busy;
    document.getElementById("check-update-btn").disabled = busy;
    const inst = document.getElementById("install-update-btn");
    if (inst.style.display !== "none") inst.disabled = busy;
}

document.getElementById("start-btn").addEventListener("click", () => {
    hideWarn(); hideInfo();
    const btn = document.getElementById("start-btn");
    setButtonsBusy(true);
    setBusyLabel(btn, "Starting…");
    window.pywebview.api.start().then(result => {
        if (!result.ok || result.action === "started_unconfirmed") showWarn(result.detail);
        refresh();
    }).finally(() => {
        setButtonsBusy(false);
        restoreLabel(btn);
    });
});

document.getElementById("stop-btn").addEventListener("click", () => {
    hideWarn(); hideInfo();
    const btn = document.getElementById("stop-btn");
    setButtonsBusy(true);
    setBusyLabel(btn, "Stopping…");
    window.pywebview.api.stop().then(result => {
        if (result.action === "forced") showWarn(result.detail);
        else if (!result.ok) showWarn(result.detail || "Stop did not complete cleanly.");
        else if (result.action === "graceful") showInfo(result.detail);
        stopFastRefresh();
        refresh();
    }).finally(() => {
        setButtonsBusy(false);
        restoreLabel(btn);
    });
});

document.getElementById("check-update-btn").addEventListener("click", () => {
    hideWarn(); hideInfo();
    const btn = document.getElementById("check-update-btn");
    const detailEl = document.getElementById("update-detail");
    const installBtn = document.getElementById("install-update-btn");
    setButtonsBusy(true);
    setBusyLabel(btn, "Checking…");
    window.pywebview.api.check_for_updates().then(result => {
        lastUpdateCheck = result;
        document.getElementById("v-latest").textContent = result.latest || "unavailable";
        detailEl.style.display = "block";
        detailEl.textContent = result.detail;
        if (result.ok && result.newer_available) {
            installBtn.style.display = "inline-block";
            installBtn.disabled = false;
        } else {
            installBtn.style.display = "none";
        }
        if (!result.ok) showWarn(result.detail);
    }).finally(() => {
        setButtonsBusy(false);
        restoreLabel(btn);
    });
});

document.getElementById("install-update-btn").addEventListener("click", () => {
    hideWarn(); hideInfo();
    const btn = document.getElementById("install-update-btn");
    const detailEl = document.getElementById("update-detail");
    // Explicit confirm — updating stops ChatBucket, per §14. That is
    // NOT a side-effect to bury inside a spinner; the user has to
    // consent to the process going down. Same discipline the doc
    // uses for auto-restart-on-crash (§8) — never a silent default.
    const ok = window.confirm(
        "Install update?\n\n" +
        "This will:\n" +
        "  1. Stop ChatBucket gracefully.\n" +
        "  2. Back up current code.\n" +
        "  3. Download and extract the release.\n" +
        "  4. Roll back automatically if anything fails.\n\n" +
        "You'll need to click Start afterward to relaunch " +
        "(restart goes through arbitration on purpose)."
    );
    if (!ok) return;

    setButtonsBusy(true);
    setBusyLabel(btn, "Installing…");
    window.pywebview.api.install_update().then(result => {
        detailEl.style.display = "block";
        detailEl.textContent = result.detail;
        if (result.ok && result.step === "done") {
            showInfo(result.detail);
            document.getElementById("install-update-btn").style.display = "none";
            // The version we just installed is now the local one —
            // update the row immediately without waiting for the next
            // refresh cycle. get_status() will confirm on refresh.
            refresh();
        } else if (result.ok && result.step === "noop") {
            showInfo(result.detail);
        } else {
            showWarn(result.detail || "Update failed.");
        }
        refresh();
    }).finally(() => {
        setButtonsBusy(false);
        restoreLabel(btn);
    });
});

document.getElementById("refresh-btn").addEventListener("click", refresh);

window.addEventListener("pywebviewready", function() {
    refresh();
    normalRefreshHandle = setInterval(refresh, NORMAL_REFRESH_MS);
});
</script>

</body>
</html>
